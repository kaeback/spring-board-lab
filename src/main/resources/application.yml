spring:
  application:
    name: spring-board
  thymeleaf:
    cache: false        # 개발 중 템플릿 변경을 바로 반영 (재시작 없이)

  # step4부터 PostgreSQL에 연결한다. 로컬에 boarddb 데이터베이스를 미리 만들어 둔다. (README 참고)
  # 환경변수 DB_URL / DB_USERNAME / DB_PASSWORD 로 덮어쓸 수 있다.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/boarddb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    # driver-class-name은 URL(jdbc:postgresql)로 자동 감지되므로 생략

  jpa:
    hibernate:
      ddl-auto: update     # 엔티티 기준으로 테이블을 자동 생성/보완한다. (운영 환경에서는 validate/none 권장)
    show-sql: true         # 실행되는 SQL을 콘솔에 출력 (학습용)
    properties:
      hibernate:
        format_sql: true
    open-in-view: false    # OSIV 비활성화 — 트랜잭션 경계를 서비스 계층으로 명확히 하기 위해

  # step6: 첨부파일 업로드 크기 제한
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    session:
      # 세션 ID를 쿠키로만 주고받는다. (기본값은 쿠키+URL이라, 첫 요청의 리다이렉트 URL에
      # ;jsessionid=... 가 붙어 주소창·로그에 세션 ID가 노출된다)
      tracking-modes: cookie

# step6: 첨부파일 저장 경로 (프로젝트 루트의 uploads 폴더). 파일 자체는 DB가 아니라 디스크에 저장한다.
file:
  upload-dir: ./uploads
