spring:
  application:
    name: spring-board
  # step1은 DB를 쓰지 않으므로 datasource 설정이 없다.
  thymeleaf:
    cache: false        # 개발 중 템플릿 변경을 바로 반영 (재시작 없이)

server:
  port: 8080
  servlet:
    session:
      # 세션 ID를 쿠키로만 주고받는다. (기본값은 쿠키+URL이라, 첫 요청의 리다이렉트 URL에
      # ;jsessionid=... 가 붙어 주소창·로그에 세션 ID가 노출된다)
      tracking-modes: cookie
