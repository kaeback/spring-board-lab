<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>

<div class="container">
    <h1>로그인</h1>
    <div class="card">
        <!-- Spring Security가 처리한다: POST /login (CSRF는 이 실습에서 disable했다) -->
        <form th:action="@{/login}" method="post">
            <!-- 상세 화면의 "로그인" 링크가 붙여 준 ?redirectURL=... 을 함께 보낸다 (SecurityConfig.loginSuccessHandler) -->
            <input type="hidden" name="redirectURL" th:if="${param.redirectURL != null}" th:value="${param.redirectURL}">
            <!-- 인증 실패 시 ?error 로 돌아온다 -->
            <div class="error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다</div>
            <!-- 로그아웃 직후 안내 -->
            <p th:if="${param.logout}" style="color:#3b5bdb; font-size:14px">로그아웃 되었습니다.</p>

            <div class="form-group">
                <label for="loginId">아이디</label>
                <input type="text" id="loginId" name="loginId">
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password">
            </div>
            <button type="submit" class="btn">로그인</button>
            <a th:href="@{/join}" class="btn gray">회원가입</a>
        </form>
        <p style="margin-top:14px; font-size:13px; color:#888">
            테스트 계정: hong / kim / admin (비밀번호 모두 1234)
        </p>
    </div>
</div>
</body>
</html>
