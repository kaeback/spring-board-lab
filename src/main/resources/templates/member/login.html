<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>

<div class="container">
    <h1>로그인</h1>
    <div class="card">
        <form th:action="@{/login}" th:object="${loginForm}" method="post">
            <!-- 인터셉터·컨트롤러가 붙여 준 ?redirectURL=... 을 POST로 넘긴다 (로그인 후 원래 화면으로) -->
            <input type="hidden" name="redirectURL" th:if="${param.redirectURL != null}" th:value="${param.redirectURL}">
            <!-- 아이디/비밀번호 불일치 등 에러 메시지 -->
            <div class="error" th:if="${error != null}" th:text="${error}"></div>

            <div class="form-group">
                <label for="loginId">아이디</label>
                <input type="text" id="loginId" th:field="*{loginId}">
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" th:field="*{password}">
            </div>
            <button type="submit" class="btn">로그인</button>
            <a th:href="@{/join}" class="btn gray">회원가입</a>
        </form>
        <p style="margin-top:14px; font-size:13px; color:#888">
            테스트 계정: hong / kim / admin (비밀번호 모두 1234)
        </p>
    </div>
</div>
</body>
</html>
