<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>

<div class="container">
    <h1>회원가입</h1>
    <div class="card">
        <form th:action="@{/join}" th:object="${joinForm}" method="post">
            <!-- 아이디 중복 등 에러 메시지 -->
            <div class="error" th:if="${error != null}" th:text="${error}"></div>

            <div class="form-group">
                <label for="loginId">아이디</label>
                <input type="text" id="loginId" th:field="*{loginId}">
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" th:field="*{password}">
            </div>
            <div class="form-group">
                <label for="name">이름</label>
                <input type="text" id="name" th:field="*{name}">
            </div>
            <button type="submit" class="btn">가입</button>
            <a th:href="@{/login}" class="btn gray">로그인</a>
        </form>
    </div>
</div>
</body>
</html>
