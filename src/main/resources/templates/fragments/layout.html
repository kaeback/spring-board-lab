<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!--
  공통 상단바 조각(fragment).
  step9부터 로그인 표시는 세션 대신 Spring Security의 sec: 네임스페이스로 판단한다.
-->
<header th:fragment="topbar" class="topbar">
    <a class="brand" th:href="@{/boards}">게시판</a>
    <div class="menu">
        <a th:href="@{/boards}">목록</a>
        <span sec:authorize="isAuthenticated()">
            <b sec:authentication="principal.member.name">사용자</b>님
            <form th:action="@{/logout}" method="post" style="display:inline">
                <button type="submit" class="btn gray" style="padding:4px 10px">로그아웃</button>
            </form>
        </span>
        <span sec:authorize="isAnonymous()">
            <a th:href="@{/login}">로그인</a>
            <a th:href="@{/join}">회원가입</a>
        </span>
    </div>
</header>

<!--
  페이징 조각. 목록에서 <div th:replace="~{fragments/layout :: pagination(${page})}"></div> 로 사용한다.
  page는 Spring Data의 Page<T> 객체. 페이지 번호는 0부터지만 화면에는 +1 해서 보여준다.
-->
<div th:fragment="pagination(page)" class="pagination" th:if="${page.totalPages > 0}">
    <a th:if="${!page.first}" th:href="@{/boards(page=${page.number - 1})}">이전</a>

    <!-- th:block은 태그 없이 반복만 한다 (span으로 감싸면 .pagination span 스타일이 겹쳐 테두리가 두 번 그려진다) -->
    <th:block th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
        <span th:if="${i == page.number}" class="active" th:text="${i + 1}">1</span>
        <a th:unless="${i == page.number}" th:href="@{/boards(page=${i})}" th:text="${i + 1}">1</a>
    </th:block>

    <a th:if="${!page.last}" th:href="@{/boards(page=${page.number + 1})}">다음</a>
</div>

</body>
</html>
