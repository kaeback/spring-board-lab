<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${board.title}">글 상세</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>

<div class="container">
    <div class="card">
        <h1 th:text="${board.title}">제목</h1>
        <div class="post-meta">
            작성자 <b th:text="${board.writer}">작성자</b>
            · 조회 <span th:text="${board.viewCount}">0</span>
            · <span th:text="${#temporals.format(board.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span>
        </div>

        <div class="original-label">내용</div>
        <div class="post-content" th:text="${board.content}">내용</div>

        <!-- 첨부파일 (있을 때만) -->
        <div class="attachment" th:if="${board.hasAttachment}">
            📎 첨부파일:
            <a th:href="@{/boards/{id}/download(id=${board.id})}"
               th:text="${board.originalFileName}">파일명</a>
        </div>

        <div class="button-row">
            <a th:href="@{/boards}" class="btn gray">목록</a>

            <!-- 작성자 본인에게만 수정/삭제 노출 -->
            <span th:if="${session.loginMember != null and session.loginMember.loginId == board.writer}">
                <a th:href="@{/boards/{id}/edit(id=${board.id})}" class="btn">수정</a>
                <form th:action="@{/boards/{id}/delete(id=${board.id})}" method="post"
                      style="display:inline" onsubmit="return confirm('정말 삭제하시겠습니까?');">
                    <button type="submit" class="btn danger">삭제</button>
                </form>
            </span>
        </div>
    </div>
</div>
</body>
</html>
