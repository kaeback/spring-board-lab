<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>게시판</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>

<div class="container">
    <h1>게시글 목록</h1>

    <div class="toolbar">
        <span></span>
        <a sec:authorize="isAuthenticated()" th:href="@{/boards/write}" class="btn">글쓰기</a>
    </div>

    <table class="board-list">
        <thead>
        <tr>
            <th class="center" style="width:70px">번호</th>
            <th>제목</th>
            <th style="width:120px">작성자</th>
            <th class="center" style="width:80px">조회</th>
            <th class="center" style="width:130px">작성일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${page.isEmpty()}">
            <td class="center" colspan="5">등록된 글이 없습니다.</td>
        </tr>
        <tr th:each="board, stat : ${page.content}">
            <!-- 최신글이 큰 번호가 되도록 전체개수 기준으로 역순 번호 부여 -->
            <td class="center"
                th:text="${page.totalElements - (page.number * page.size) - stat.index}">1</td>
            <td>
                <a th:href="@{/boards/{id}(id=${board.id})}" th:text="${board.title}">제목</a>
                <span th:if="${board.hasAttachment}" title="첨부파일">📎</span>
            </td>
            <td th:text="${board.writer}">작성자</td>
            <td class="center" th:text="${board.viewCount}">0</td>
            <td class="center" th:text="${#temporals.format(board.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</td>
        </tr>
        </tbody>
    </table>

    <!-- 페이징 조각 -->
    <div th:replace="~{fragments/layout :: pagination(${page})}"></div>
</div>
</body>
</html>
