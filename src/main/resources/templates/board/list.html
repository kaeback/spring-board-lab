<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시판</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>

<div class="container">
    <h1>게시글 목록</h1>

    <div class="toolbar">
        <span></span>
        <!-- 글쓰기는 로그인한 사용자에게만 -->
        <a th:if="${session.loginMember != null}" th:href="@{/boards/write}" class="btn">글쓰기</a>
    </div>

    <table class="board-list">
        <thead>
        <tr>
            <th class="center" style="width:70px">번호</th>
            <th>제목</th>
            <th style="width:120px">작성자</th>
            <th class="center" style="width:80px">조회</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${boards.isEmpty()}">
            <td class="center" colspan="4">등록된 글이 없습니다.</td>
        </tr>
        <tr th:each="board : ${boards}">
            <td class="center" th:text="${board.id}">1</td>
            <td>
                <a th:href="@{/boards/{id}(id=${board.id})}" th:text="${board.title}">제목</a>
            </td>
            <td th:text="${board.writer}">작성자</td>
            <td class="center" th:text="${board.viewCount}">0</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
