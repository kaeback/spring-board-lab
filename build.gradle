plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'net.datasa'
version = '0.0.1-SNAPSHOT'
description = 'spring-board (step5 - 필터·인터셉터)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // step5는 웹 + 화면(Thymeleaf) + 세션 로그인 + 검증 + JPA + 필터/인터셉터를 사용한다. 시큐리티는 다음 단계에서 추가한다.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'   // Boot 4: 옛 starter-web
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'   // step3
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'     // step4
    runtimeOnly 'org.postgresql:postgresql'                                   // step4
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    // Boot 4: 기술별 테스트 스타터 (각각 spring-boot-starter-test 포함)
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'  // step4
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
