plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'net.datasa'
version = '0.0.1-SNAPSHOT'
description = 'spring-board (step1 - 메모리)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // step1은 웹 + 화면(Thymeleaf)만 사용한다. DB·시큐리티·검증 등은 다음 단계에서 추가한다.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'   // Boot 4: 옛 starter-web
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    // Boot 4: 기술별 테스트 스타터 (각각 spring-boot-starter-test 포함)
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
