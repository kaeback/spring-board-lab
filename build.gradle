plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'net.datasa'
version = '0.0.1-SNAPSHOT'
description = 'spring-board (step9 - 시큐리티)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// step8: Mockito를 JVM 에이전트로 등록 (JDK 21+에서 '동적 에이전트 로딩' 경고 제거)
configurations {
    mockitoAgent
}

repositories {
    mavenCentral()
}

dependencies {
    // step9는 웹 + 화면 + 검증 + JPA + 파일업로드/페이징 + 댓글 API + 테스트 + 시큐리티를 사용한다.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'   // Boot 4: 옛 starter-web
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'   // step3
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'     // step4
    runtimeOnly 'org.postgresql:postgresql'                                   // step4
    implementation 'org.springframework.boot:spring-boot-starter-security'     // step9
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'     // step9 (sec: 네임스페이스)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    // Boot 4: 기술별 테스트 스타터 (각각 spring-boot-starter-test 포함)
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'  // step4
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'  // step9 (@WithMockUser 등)
    testRuntimeOnly 'com.h2database:h2'                                        // step8: 테스트용 내장 DB
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    mockitoAgent('org.mockito:mockito-core') { transitive = false }               // step8
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"   // step8
}
