plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'net.datasa'
version = '0.0.1-SNAPSHOT'
description = 'spring-board (step8 - 테스트)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// step8: Mockito를 JVM 에이전트로 등록 (JDK 21+에서 '동적 에이전트 로딩' 경고 제거)
configurations {
    mockitoAgent
}

repositories {
    mavenCentral()
}

dependencies {
    // step8은 step7(웹 + 화면 + 세션 로그인 + 검증 + JPA + 필터/인터셉터 + 파일/페이징 + 댓글 API)에 테스트를 더한다. 시큐리티는 다음 단계에서 추가한다.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'   // Boot 4: 옛 starter-web
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'   // step3
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'     // step4
    runtimeOnly 'org.postgresql:postgresql'                                   // step4
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    // Boot 4: 기술별 테스트 스타터 (각각 spring-boot-starter-test 포함)
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'  // step4
    testRuntimeOnly 'com.h2database:h2'                                        // step8: 테스트용 내장 DB
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    mockitoAgent('org.mockito:mockito-core') { transitive = false }               // step8
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"   // step8
}
